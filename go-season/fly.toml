# fly.toml app configuration file generated for go-season scaffold
app = "colados-go-season"
primary_region = "iad"

[build]
  [build.args]

[env]
  GO_SEASON_ADDR = ":8080"
  GO_SEASON_SQLITE = "/data/pes6_league_db.sqlite"
  GO_SEASON_TICK_MS = "800"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 200
    soft_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[mounts]
  source = "season_data"
  destination = "/data"
